worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Sits between oauth2-proxy-admin and arc:8080 (see docker-compose.yml)
  # purely to inject the Aachen color-scheme stylesheet into
  # dcm4chee-arc-ui2's app shell. Nothing else about the admin path
  # changes: same upstream, same DICOMweb REST API, no auth of its own -
  # oauth2-proxy-admin still gates everything upstream of this.
  server {
    listen 80;
    client_max_body_size 0;

    # dcm4chee-arc-ui2 is an Angular SPA with *path*-based routing and a
    # server-side fallback: WildFly serves the same index.html for any
    # extension-less path under ui2/ (e.g. .../ui2/study/patient,
    # .../ui2/monitoring/control - verified directly against arc:8080),
    # not just "/" and "/index.html" as originally assumed here. Every
    # real static asset (js/css/png/...) has a file extension, so that's
    # the split: this first block matches assets and skips sub_filter,
    # keeping gzip and caching intact for them; the second block below
    # catches every other ui2/ path as app-shell HTML.
    location ~ ^/dcm4chee-arc/ui2/.*\.[a-zA-Z0-9]+$ {
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/dcm4chee-arc/ui2(/.*)?$ {
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # sub_filter can't rewrite a gzip-compressed response body; this is
      # a few KB of HTML so serving it uncompressed here is a non-issue.
      proxy_set_header Accept-Encoding "";

      # text/html is nginx's default sub_filter_types value already;
      # naming it explicitly here just trips an nginx "duplicate MIME
      # type" warning at startup for no benefit.
      sub_filter_once on;
      sub_filter '</head>' '<link rel="stylesheet" href="aachen-theme.css"></head>';
    }

    # Our theme stylesheet, referenced by the relative href above and
    # resolved against index.html's <base href="/dcm4chee-arc/ui2/">.
    location = /dcm4chee-arc/ui2/aachen-theme.css {
      alias /etc/nginx/aachen-theme.css;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
