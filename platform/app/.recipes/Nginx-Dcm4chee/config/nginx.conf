worker_processes auto;
error_log /var/logs/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/logs/nginx/access.log main;

  # PHI access audit trail for everything OHIF does against dcm4chee.
  #
  # This is the busiest path to patient data in the deployment and it never
  # touches the Flask GUI: browser -> oauth2-proxy:1081 -> here -> arc:8080.
  # dcm4chee has no authentication of its own behind this proxy, so its logs
  # can only ever name an IP; the username exists solely because oauth2-proxy
  # is started with --set-xauthrequest and --pass-user-headers (see
  # docker-compose.yml) and hands it to us in these headers. Removing either
  # flag turns every line below anonymous.
  #
  # The request URI is the audited object: under DICOMweb, method + URI is
  # what distinguishes a QIDO-RS search from a WADO-RS retrieval of one
  # patient's images from a STOW-RS store, and it carries the study, series
  # and instance UIDs. JSON so it can be read with the same tooling as the
  # GUI's own trail (app/utils/audit.py).
  #
  # Which header carries the username depends on how oauth2-proxy is run, and
  # the flags are easy to confuse: --pass-user-headers sets the X-Forwarded-*
  # headers on the request it sends *upstream* (that is us, and those are the
  # ones that arrive here), while --set-xauthrequest sets X-Auth-Request-* on
  # its *response*, for nginx auth_request mode.
  #
  # Preferred-Username first, and that ordering matters: with
  # --prefer-email-to-user=false, X-Forwarded-User carries Keycloak's "sub"
  # claim, so logging it yields lines attributed to
  # "ea7d9c5d-df5e-4fba-94f5-60a2d2741058". That is technically resolvable in
  # Keycloak and useless in practice. X-Forwarded-Preferred-Username is the
  # login name, which is also what the GUI's own trail records as "actor"
  # (app/utils/audit.py reads the preferred_username claim), so the two logs
  # can be filtered and joined on the same value.
  #
  # Falls back to a literal "anonymous" so an unattributed access is visibly
  # unattributed rather than an empty string that reads like a logging bug.
  map $http_x_forwarded_preferred_username $audit_user_1 {
    ""      $http_x_forwarded_user;
    default $http_x_forwarded_preferred_username;
  }
  map $audit_user_1 $audit_user_2 {
    ""      $http_x_auth_request_user;
    default $audit_user_1;
  }
  map $audit_user_2 $audit_user {
    ""      "anonymous";
    default $audit_user_2;
  }
  map $http_x_forwarded_email $audit_email {
    ""      $http_x_auth_request_email;
    default $http_x_forwarded_email;
  }

  # actor_sub is logged next to actor deliberately: "actor" is the login name,
  # which is what a human filters on but which Keycloak lets you rename, while
  # the "sub" claim is opaque and permanent. Keeping both means a trail from
  # two years ago still resolves to a person after a rename, and it removes
  # any doubt about which header a given line was attributed from.
  log_format phi_audit escape=json
  '{"ts":"$time_iso8601","actor":"$audit_user",'
  '"actor_sub":"$http_x_forwarded_user",'
  '"actor_email":"$audit_email","actor_ip":"$remote_addr",'
  '"forwarded_for":"$http_x_forwarded_for","system":"dcm4chee",'
  '"method":"$request_method","object":"$uri","criteria":"$args",'
  '"status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"user_agent":"$http_user_agent"}';

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_disable "msie6";
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 0;


    # Handle /pacs requests and rewrite them to the correct dcm4chee-arc UI path
    # This allows accessing the dcm4chee-arc UI through the /pacs URL
    location /pacs {
      access_log /var/logs/nginx/phi-audit.log phi_audit;
      rewrite ^/pacs(.*)$ /dcm4chee-arc/ui2$1 break;
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      expires 0;
      add_header Cache-Control private;
    }

    # Proxy all dcm4chee-arc requests
    # This block handles all API requests and general dcm4chee-arc paths
    location /dcm4chee-arc/ {
      # Every request that can reach patient data gets an audit line. This
      # includes the UI2 app's own static assets, which is noise, but the
      # alternative - excluding paths by extension - risks silently excluding
      # a DICOMweb response that happens to end in one, and a trail with a
      # hole in it is worth less than a verbose one.
      access_log /var/logs/nginx/phi-audit.log phi_audit;
      proxy_pass http://arc:8080/dcm4chee-arc/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # QIDO-RS query endpoints (study/series/instance lists) and WADO-RS bulk
    # metadata must never be cached by the browser: they're re-queried every
    # time a study is opened, and a stale cached copy is how newly-STOW'd
    # series (e.g. AI segmentation results) silently fail to show up even
    # after a hard reload. Deliberately narrower than /dcm4chee-arc/ so that
    # WADO-RS pixel-frame requests (.../frames/N) stay cacheable - actual
    # image data for a given instance is immutable and caching it is a real
    # performance win for large studies.
    location ~ /dcm4chee-arc/.*/(studies|series|instances|metadata)$ {
      # A regex location wins over the /dcm4chee-arc/ prefix above, so this
      # needs its own access_log or QIDO-RS searches - the "who searched"
      # half of the trail - would be the one thing missing from it.
      access_log /var/logs/nginx/phi-audit.log phi_audit;
      proxy_pass http://arc:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }


    location /sw.js {
      add_header Cache-Control "no-cache";
      proxy_cache_bypass $http_pragma;
      proxy_cache_revalidate on;
      expires off;
      access_log off;
    }

    location / {
      root /var/www/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
  }
}
